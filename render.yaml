services:
  - type: web
    name: makhado-community-health-centre-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: ADMIN_EMAIL
        value: admin@makhado-demo.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
